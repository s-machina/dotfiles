# ============================================================================
# General Settings
# ============================================================================

# Set prefix to Ctrl-a (easier than Ctrl-b)
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# Enable mouse support
set -g mouse on

# Start windows and panes at 1, not 0
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Increase history limit
set -g history-limit 50000

# Faster escape time (for vim)
set -sg escape-time 0

# Enable extended keys for Shift+Enter support (requires terminal support)
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'ghostty:extkeys'

# Enable true color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ============================================================================
# Key Bindings
# ============================================================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Split panes using | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with vim keys
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Shift+Enter sends soft return (for Claude Code, etc.)
# Works with terminals that support CSI u / extended keys
bind -n S-Enter send-keys Escape "[13;2u"

# Quick window switching
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5

# ============================================================================
# Three-Split Layout
# ============================================================================

# Create new window with three-split layout (prefix + 3)
bind-key 3 new-window \; \
    split-window -h -p 50 \; \
    split-window -v -p 50 \; \
    select-pane -t 0 \; \
    display "Three-split layout created"

# Apply three-split layout to current window (prefix + Shift+3)
bind-key '#' \
    split-window -h -p 50 \; \
    split-window -v -p 50 \; \
    select-pane -t 0 \; \
    display "Three-split layout applied to current window"

# ============================================================================
# Copy Mode (Vi style)
# ============================================================================

setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# ============================================================================
# Status Bar
# ============================================================================

set -g status-position bottom
set -g status-left-length 40
set -g status-right-length 60

# Theme colors - sourced from external file managed by themes/switch-theme.sh
# This file is auto-generated based on macOS system appearance
if-shell "test -f ~/.config/tmux/current-theme.conf" {
    source-file ~/.config/tmux/current-theme.conf
} {
    # Fallback to dark theme if no theme file exists
    set -g status-style 'bg=#1f2335 fg=#c0caf5'
    set -g pane-border-style 'fg=#3b4261'
    set -g pane-active-border-style 'fg=#7aa2f7'
    set -g window-status-current-format '#[fg=#7aa2f7,bold] #I:#W '
    set -g window-status-format '#[fg=#565f89] #I:#W '
    set -g status-left '#[fg=#7aa2f7,bold] #S #[fg=#3b4261]│ '
    set -g status-right '#[fg=#3b4261]│ #[fg=#9ece6a]%H:%M #[fg=#3b4261]│ #[fg=#bb9af7]%d %b'
}

# Override status bar color when connected via SSH
if-shell '[ -n "$SSH_CONNECTION" ]' {
    set -g status-style 'bg=#9414e6 fg=#1f2335'
    set -g status-left '#[fg=#1f2335,bold] #h:#S #[fg=#bb9af7]│ '
}

